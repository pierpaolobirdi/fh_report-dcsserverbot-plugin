# Builds the configuration editor (tools/fh_report_config.pyw) into Fh_Report_Config.exe and attaches it to the
# GitHub release. It runs when a release is published, or by hand from the Actions tab (Run workflow) for an
# existing tag. The .exe is never committed to the repository.
name: Build configuration editor

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the .exe to (leave empty to only build it and keep it as an artifact)"
        required: false
        default: ""

permissions:
  contents: write          # to attach the files to the release

jobs:
  exe:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the build needs
        run: python -m pip install --upgrade pip pyinstaller ruamel.yaml pytest

      - name: Tests of the editor
        run: python -m pytest tests/test_config_editor_core.py tests/test_options_catalog.py -q

      - name: Build Fh_Report_Config.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Fh_Report_Config `
            --paths "$PWD\tools" `
            --add-data "$PWD\tools\fh_report_options.yaml;." `
            --add-data "$PWD\plugins\fh_report\schemas\fh_report_schema.yaml;plugins\fh_report\schemas" `
            --distpath "$PWD\dist" --workpath "$PWD\build" --specpath "$PWD\build" `
            "$PWD\tools\fh_report_config.pyw"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check that the packed program starts and reads its option list
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\dist\Fh_Report_Config.exe" -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The packed program failed its self-check (exit code $($p.ExitCode))" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "$PWD\dist\Fh_Report_Config.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Fh_Report_Config.exe" | Out-File -Encoding ascii "$PWD\dist\Fh_Report_Config.exe.sha256"
          Get-Content "$PWD\dist\Fh_Report_Config.exe.sha256"

      - name: Keep the files of this run
        uses: actions/upload-artifact@v4
        with:
          name: Fh_Report_Config
          path: |
            dist/Fh_Report_Config.exe
            dist/Fh_Report_Config.exe.sha256

      - name: Attach them to the release
        if: ${{ env.TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" dist/Fh_Report_Config.exe dist/Fh_Report_Config.exe.sha256 --clobber
